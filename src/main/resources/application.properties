spring.application.name=focus

# ??dev????????
spring.profiles.active=dev

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/new_schema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

mybatis.mapper-locations=classpath:mapper/*.xml

# ??????????
# ??Prometheus????????health?info?
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoints.web.base-path=/actuator

# ????
# ????????????????????
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=dev

# ???????????1m?????
management.metrics.export.prometheus.step=15s

# ??JVM?Tomcat????????????
management.metrics.enable.jvm=true
management.metrics.enable.tomcat=true
management.metrics.enable.process=true

# ????????????????????????
management.micrometer.metrics.naming.rule=snake_case